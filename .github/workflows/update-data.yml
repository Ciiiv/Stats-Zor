name: Update data

on:
  schedule:
    # Every day at 12:17 UTC (7:17 a.m. Eastern in winter, 8:17 in summer),
    # after MoneyPuck's overnight update.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every season and career from scratch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/build_data.py --full
          else
            python scripts/build_data.py
          fi

      - name: Build shot maps
        continue-on-error: true
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/build_shots.py --full
          else
            python scripts/build_shots.py
          fi

      - name: Build deployment data
        continue-on-error: true
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/build_usage.py --full
          else
            python scripts/build_usage.py
          fi

      - name: Build NHL EDGE tracking stats
        continue-on-error: true
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/build_edge.py --full
          else
            python scripts/build_edge.py
          fi

      - name: Build value, rosters and prospects
        continue-on-error: true
        run: python scripts/build_value.py

      - name: Commit changes
        run: |
          git config user.name "stats-zor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
